<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>QueryGuard — Safe Text-to-SQL</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&family=Fraunces:opsz,wght@9..144,500;9..144,650;9..144,700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/static/styles.css" />
</head>
<body>
  <div class="bg-grid" aria-hidden="true"></div>
  <div class="bg-glow" aria-hidden="true"></div>

  <header class="topbar">
    <div class="brand">
      <span class="brand-mark" aria-hidden="true"></span>
      <div>
        <h1 class="brand-name">QueryGuard</h1>
        <p class="brand-tag">Local text-to-SQL with guardrails</p>
      </div>
    </div>
    <div class="status-pills" id="statusPills">
      <span class="pill" data-key="db">DB …</span>
      <span class="pill" data-key="ollama">Ollama …</span>
      <span class="pill" data-key="model">Model …</span>
    </div>
  </header>

  <main class="layout">
    <aside class="rail">
      <section class="panel">
        <div class="panel-head">
          <h2>Schema</h2>
          <button type="button" class="btn ghost" id="refreshSchema">Refresh</button>
        </div>
        <p class="muted" id="schemaMeta">Loading…</p>
        <div class="schema-list" id="schemaList"></div>
      </section>

      <section class="panel">
        <div class="panel-head">
          <h2>History</h2>
          <button type="button" class="btn ghost" id="clearHistory">Clear</button>
        </div>
        <div class="history-list" id="historyList">
          <p class="muted">No queries yet.</p>
        </div>
      </section>
    </aside>

    <section class="workspace">
      <div class="ask-shell">
        <label class="ask-label" for="question">Ask your database</label>
        <textarea id="question" rows="3" placeholder="e.g. Which customers placed the most orders?"></textarea>
        <div class="ask-row">
          <div class="chips" id="exampleChips"></div>
          <div class="ask-actions">
            <label class="toggle">
              <input type="checkbox" id="validateOnly" />
              <span>Validate only</span>
            </label>
            <label class="toggle">
              <input type="checkbox" id="skipJudge" />
              <span>Skip judge</span>
            </label>
            <button type="button" class="btn primary" id="runBtn">
              <span class="btn-label">Run pipeline</span>
              <span class="btn-spinner" hidden></span>
            </button>
          </div>
        </div>
      </div>

      <div class="pipeline-track" id="pipelineTrack" hidden>
        <h2 class="sr-only">Pipeline stages</h2>
        <ol class="stages" id="stages"></ol>
      </div>

      <div class="alert" id="alertBox" hidden></div>

      <div class="result-grid" id="resultGrid" hidden>
        <article class="panel span-2">
          <div class="panel-head">
            <h2>Generated SQL</h2>
            <div class="row-actions">
              <span class="badge" id="statusBadge">—</span>
              <span class="muted" id="confidenceLabel"></span>
            </div>
          </div>
          <textarea id="sqlEditor" class="sql-editor" rows="10" spellcheck="false"></textarea>
          <div class="ask-actions end">
            <button type="button" class="btn ghost" id="copySql">Copy</button>
            <button type="button" class="btn secondary" id="rerunSql">Re-check edited SQL</button>
          </div>
        </article>

        <article class="panel">
          <h2>Safety report</h2>
          <div id="safetyReport" class="report"></div>
        </article>

        <article class="panel">
          <h2>Hallucination check</h2>
          <div id="hallReport" class="report"></div>
        </article>

        <article class="panel span-2">
          <div class="panel-head">
            <h2>Results</h2>
            <span class="muted" id="resultMeta"></span>
          </div>
          <div class="table-wrap" id="resultTable"></div>
        </article>
      </div>
    </section>
  </main>

  <footer class="footer">
    <span>Fail-closed · read-only · fully local</span>
    <a href="/docs" target="_blank" rel="noopener">API docs</a>
  </footer>

  <script src="/static/app.js"></script>
</body>
</html>
